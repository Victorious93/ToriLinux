DEFAULT default
PROMPT 1
TIMEOUT 50
LABEL default
MENU LABEL VictorLinux
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% cow_spacesize=2G
LABEL safe
MENU LABEL VictorLinux (safe graphics: nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% cow_spacesize=2G nomodeset
