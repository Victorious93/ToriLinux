name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-jinja2 python3-pytest
      - name: Render every profile (templates must always render)
        run: |
          for p in "amd headless" "amd gui" "amd empty" "cuda headless" "cuda gui" "rocm headless"; do
            python3 .ci/configure.py $p >/dev/null
          done
          python3 .ci/configure.py cuda gui --packs comfyui,sillytavern,vllm >/dev/null
          python3 .ci/configure.py amd headless >/dev/null
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh airootfs/usr/local/bin/tori-open airootfs/usr/local/bin/tori-tls-cert \
            airootfs/usr/local/bin/tori-bench airootfs/usr/local/lib/tori/tori-boot-setup \
            airootfs/root/customize_airootfs.sh airootfs/root/customize_airootfs/root-scripts/*.sh \
            airootfs/root/customize_airootfs/scripts/*.sh profiledef.sh
          bash -n profiledef.sh
      - name: Python
        run: |
          python3 -m py_compile airootfs/usr/local/lib/tori/*.py airootfs/usr/local/lib/tori/tori-priv
          python3 -m pytest -q tests
